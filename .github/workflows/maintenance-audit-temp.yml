name: Stordex maintenance audit

on:
  push:
    branches:
      - maintenance/stordex-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stordex
          POSTGRES_PASSWORD: stordex
          POSTGRES_DB: stordex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stordex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
      NEXTAUTH_SECRET: ci-secret-not-for-production-only-32-bytes-xxxx
      NEXTAUTH_URL: http://localhost:3000
      APP_ENV: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Full dependency audit report
        run: npm audit || true

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply schema to test DB
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
