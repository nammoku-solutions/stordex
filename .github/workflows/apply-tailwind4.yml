name: Apply Tailwind 4 migration

on:
  push:
    branches:
      - deps/tailwind-4-migration

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[tailwind4]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deps/tailwind-4-migration

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Run official Tailwind v4 upgrade
        run: npx @tailwindcss/upgrade@4.3.3 --force

      - name: Refresh lockfile
        run: npm install

      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit

      - name: Generate Prisma client and typecheck
        env:
          DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
        run: |
          npx prisma generate
          npm run typecheck

      - name: Unit tests
        env:
          DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
        run: npm test

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'deps: migrate to Tailwind CSS 4.3.3 [tailwind4]'
          git push origin HEAD:deps/tailwind-4-migration
