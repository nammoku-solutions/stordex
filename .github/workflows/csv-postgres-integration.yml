name: CSV PostgreSQL Integration

on:
  push:
    branches: [test/csv-import-postgres-idempotence-20261017, "fix/b2b-safe-document-sequences-*", test/order-ledger-concurrency-20261017, "fix/b2b-accept-cancel-races-*", "feat/b2b-pre-shipment-coordinated-cancel-*", "fix/b2b-form-submitting-feedback-*", "fix/unified-busy-button-spinner-*", "chore/neon-staging-migration-preflight-*", "feat/inventory-policy-pack-master-dashboard-*"]
  pull_request:
    branches: [main, develop, test/csv-import-postgres-idempotence-20261017, fix/b2b-safe-document-sequences-20261017, test/order-ledger-concurrency-20261017, fix/b2b-accept-cancel-races-20261017, feat/b2b-pre-shipment-coordinated-cancel-20261017, fix/b2b-form-submitting-feedback-20261018, fix/unified-busy-button-spinner-20261019, chore/neon-staging-migration-preflight-20261019]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  csv-import:
    name: B2B document serial / CSV / Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stordex
          POSTGRES_PASSWORD: stordex
          POSTGRES_DB: stordex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stordex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
      NEXTAUTH_SECRET: ci-secret-not-for-production-only-32-bytes-xxxx
      NEXTAUTH_URL: http://localhost:3000
      APP_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Migrate disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Run CSV unit and real-DB integration tests
        run: npm test -- src/lib/csv/roundtrip.test.ts src/lib/csv/postgres-import.integration.test.ts src/lib/document-numbering.integration.test.ts src/lib/order-transitions.test.ts src/lib/order-status.integration.test.ts src/lib/b2b-races.integration.test.ts src/lib/b2b-coordinated-cancellation.integration.test.ts scripts/preflight-staging-migrations.test.mjs src/lib/inventory-policy.test.ts src/lib/purchase-pack.test.ts src/lib/purchase-receipt.integration.test.ts

      - name: Typecheck Next.js and Prisma code
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Report CSV integration check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = "success" ]; then
            STATE="success"
          else
            STATE="failure"
          fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context="Stordex B2B Cancellation PostgreSQL" \
            -f description="B2B cancel/stock tests and app build ($JOB_RESULT)"
