name: CI

on:
  push:
    branches-ignore: [develop, main]
  pull_request:
    branches: [main, develop]

# develop / main へのプッシュは deploy-staging.yml / deploy-prod.yml の
# 'test' ジョブで CI を実施するため、このワークフローでは除外しています。

jobs:
  test:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stordex
          POSTGRES_PASSWORD: stordex
          POSTGRES_DB: stordex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stordex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
      NEXTAUTH_SECRET: ci-secret-not-for-production-only-32-bytes-xxxx
      NEXTAUTH_URL: http://localhost:3000
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply schema to test DB
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / Integration tests
        run: npm test

      - name: Build
        run: npm run build
