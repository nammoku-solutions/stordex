name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read

jobs:
  test:
    name: Audit / Migrate / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stordex
          POSTGRES_PASSWORD: stordex
          POSTGRES_DB: stordex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stordex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
      NEXTAUTH_SECRET: ci-secret-not-for-production-only-32-bytes-xxxx
      NEXTAUTH_URL: http://localhost:3000
      APP_ENV: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply committed migrations to test DB
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify migrated DB matches schema.prisma
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / Integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure build did not mutate tracked files
        run: git diff --exit-code -- .

      # Keep dependency audit as a required CI gate while allowing migration and test
      # diagnostics to run even when upstream advisories exist.
      - name: Report full dependency audit
        run: npm audit || true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Verify original invoice scan with real ClamAV and synthetic PDFs only
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clamav-daemon
          node --import tsx scripts/ci-smoke-original-invoice-clamd.ts

      # Only the ephemeral PostgreSQL 16 service is modified. This does NOT
      # create a Prisma migration or touch Neon Staging or AWS Production.
      - name: Rehearse unapproved CreditNote migration 12 on disposable CI DB ONLY
        run: node scripts/ci-rehearse-credit-migration12.mjs

      - name: Rehearse synthetic CreditNote review and evidence revocation races in CI ONLY
        run: node scripts/ci-rehearse-credit-migration12-approval.mjs

      - name: Introspect unapproved audit schema with Prisma 7 on disposable CI DB ONLY
        run: |
          set -euo pipefail
          npx prisma db pull --print > "$RUNNER_TEMP/stordex-credit-m12-introspected.prisma"
          node scripts/ci-check-credit-migration12-introspection.mjs "$RUNNER_TEMP/stordex-credit-m12-introspected.prisma"
          node scripts/ci-validate-credit-m12-prisma-candidate.mjs "$RUNNER_TEMP/stordex-credit-m12-introspected.prisma"
          npx prisma validate --schema "$RUNNER_TEMP/stordex-credit-m12-introspected.prisma"
          npx prisma migrate diff --from-config-datasource --to-schema "$RUNNER_TEMP/stordex-credit-m12-introspected.prisma" --exit-code
          git diff --exit-code -- prisma/schema.prisma prisma/migrations

      - name: Package validated CreditNote migration 12 candidate (not approved)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stordex-credit-m12-candidate"
          mkdir "$out"
          cp docs/migration-proposals/20261112_credit_currency_and_approval/001_additive_schema_DRAFT_DO_NOT_APPLY.sql \
            "$out/001_additive_schema_DRAFT_DO_NOT_APPLY.sql"
          cp "$RUNNER_TEMP/stordex-credit-m12-introspected.prisma" "$out/candidate.prisma"
          printf 'status=NOT_APPROVED_NOT_APPLIED\nsource_commit=%s\n' "$(git rev-parse HEAD)" \
            > "$out/RELEASE_CANDIDATE.txt"
          printf 'verification=disposable_PostgreSQL_16_and_Prisma_CI_only\n' >> "$out/RELEASE_CANDIDATE.txt"
          (
            cd "$out"
            sha256sum 001_additive_schema_DRAFT_DO_NOT_APPLY.sql candidate.prisma > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Retain the unapproved migration 12 candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: stordex-credit-m12-candidate-not-approved
          path: ${{ runner.temp }}/stordex-credit-m12-candidate/
          if-no-files-found: error
          retention-days: 30
