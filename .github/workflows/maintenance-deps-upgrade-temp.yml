name: Stordex dependency upgrade

on:
  push:
    branches:
      - maintenance/stordex-audit
    paths:
      - '.github/workflows/maintenance-deps-upgrade-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: maintenance/stordex-audit

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Override vulnerable tsx esbuild dependency
        run: |
          npm pkg set 'overrides.tsx.esbuild=0.28.2'
          npm install

      - name: Show dependency path
        run: npm explain esbuild

      - name: Verify full dependency audit
        run: npm audit --audit-level=low

      - name: Commit dependency manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: pin safe esbuild for tsx tooling'
          git push origin HEAD:maintenance/stordex-audit
