name: Deploy Staging (AWS / SST)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Migrate and deploy staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: stordex-staging
      cancel-in-progress: true
    env:
      AWS_REGION: ap-southeast-2
      APP_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-stordex-staging
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity
      - run: npm ci
      - name: Apply committed migrations
        run: npx prisma migrate deploy
      - name: Configure SST secrets
        env:
          POOLED_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          NEXTAUTH_SECRET_VALUE: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL_VALUE: https://${{ vars.STAGING_DOMAIN }}
        run: |
          npx sst secret set DatabaseUrl "$POOLED_DATABASE_URL" --stage staging
          npx sst secret set NextAuthSecret "$NEXTAUTH_SECRET_VALUE" --stage staging
          npx sst secret set NextAuthUrl "$NEXTAUTH_URL_VALUE" --stage staging
      - name: Deploy
        run: npx sst deploy --stage staging
      - name: Smoke test
        run: curl --fail --retry 6 --retry-delay 10 "https://${{ vars.STAGING_DOMAIN }}/login"
