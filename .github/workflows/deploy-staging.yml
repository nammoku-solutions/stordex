name: Deploy Staging (Vercel)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

# Vercel 連携設定（要 GitHub Secrets）:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Vercel ダッシュボード側で DATABASE_URL / NEXTAUTH_SECRET / NEXTAUTH_URL を
#   "Preview" 環境向けに設定済みであること（Production 向けだけだと build 時に空になります）。

jobs:
  deploy:
    name: Deploy to Vercel (Staging)
    # CI が成功した場合のみデプロイ。手動実行 (workflow_dispatch) は無条件で実行。
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret: $v"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Set the secrets at: Settings → Secrets and variables → Actions"
            echo "See README / ENVIRONMENTS.md for details."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Preview env vars are present
        run: |
          envfile=".vercel/.env.preview.local"
          if [ ! -f "$envfile" ]; then
            echo "::error::$envfile not found. Did 'vercel pull' succeed?"
            exit 1
          fi
          missing=0
          for v in DATABASE_URL NEXTAUTH_SECRET NEXTAUTH_URL; do
            if ! grep -qE "^${v}=" "$envfile" || grep -qE "^${v}=\"?\"?$" "$envfile"; then
              echo "::error::Vercel Preview env var '$v' is missing or empty."
              echo "  → Set it on Vercel: Project Settings → Environment Variables → Environment: Preview"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Build for Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview = Staging)
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $URL"
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        id: deploy

      - name: Summary
        run: echo "Staging URL ${{ steps.deploy.outputs.deploy_url }}" >> "$GITHUB_STEP_SUMMARY"
