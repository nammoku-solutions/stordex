name: Deploy Staging (Vercel)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Vercel 連携設定（要 GitHub Secrets）:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Vercel ダッシュボード側で DATABASE_URL / NEXTAUTH_SECRET / NEXTAUTH_URL を設定済みであること。
# Vercel CLI は実運用で検証済みの version を明示的に固定し、upgrade は別変更としてレビューする。

jobs:
  deploy:
    name: Deploy to Vercel (Staging)
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install pinned Vercel CLI
        run: |
          npm install --global vercel@59.3.0
          vercel --version

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview = Staging)
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $URL"
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        id: deploy

      - name: Summary
        run: echo "Staging URL ${{ steps.deploy.outputs.deploy_url }}" >> "$GITHUB_STEP_SUMMARY"
