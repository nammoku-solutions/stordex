name: Deploy Staging (Vercel)

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Vercel 連携設定（要 GitHub Secrets）:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Vercel ダッシュボード側で DATABASE_URL / NEXTAUTH_SECRET / NEXTAUTH_URL を
#   "Preview" 環境向けに設定済みであること（Production 向けだけだと build 時に空になります）。
#
# 構成: test ジョブが成功した場合のみ deploy ジョブが走る (needs: test)。
# CI ワークフロー (.github/workflows/ci.yml) は PR 検証用としても引き続き使用。

jobs:
  test:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stordex
          POSTGRES_PASSWORD: stordex
          POSTGRES_DB: stordex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stordex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
      NEXTAUTH_SECRET: ci-secret-not-for-production-only-32-bytes-xxxx
      NEXTAUTH_URL: http://localhost:3000
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to Vercel (Staging)
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub secret: $v"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Set the secrets at: Settings → Secrets and variables → Actions"
            echo "See README / ENVIRONMENTS.md for details."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Preview env vars are present
        run: |
          envfile=".vercel/.env.preview.local"
          if [ ! -f "$envfile" ]; then
            echo "::error::$envfile not found. Did 'vercel pull' succeed?"
            exit 1
          fi
          missing=0
          for v in DATABASE_URL NEXTAUTH_SECRET NEXTAUTH_URL; do
            if ! grep -qE "^${v}=" "$envfile" || grep -qE "^${v}=\"?\"?$" "$envfile"; then
              echo "::error::Vercel Preview env var '$v' is missing or empty."
              echo "  → Set it on Vercel: Project Settings → Environment Variables → Environment: Preview"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi

      - name: Build for Vercel
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Preview = Staging)
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $URL"
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        id: deploy

      - name: Summary
        run: echo "Staging URL ${{ steps.deploy.outputs.deploy_url }}" >> "$GITHUB_STEP_SUMMARY"
