name: Security dependency remediation rehearsal

on:
  push:
    branches: [fix/security-production-audit-20261023]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renovate-audit-rehearsal:
    name: Safe semver audit fix, verify and commit lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/fix/security-production-audit-20261023'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stordex
          POSTGRES_PASSWORD: stordex
          POSTGRES_DB: stordex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stordex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
      NEXTAUTH_SECRET: ci-secret-not-for-production-only-32-bytes-xxxx
      NEXTAUTH_URL: http://localhost:3000
      APP_ENV: ci
    steps:
      - name: Checkout remediation branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - name: Start from locked clean install
        run: npm ci
      - name: Fix only compatible dependency releases
        run: |
          npm audit fix --no-fund || echo "Some non-production advisories may remain; the required production audit follows."
          git diff --stat -- package.json package-lock.json
      - name: Require zero known production advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply migrations to disposable CI PostgreSQL only
        run: npx prisma migrate deploy
      - name: Verify migration bookkeeping
        run: npx prisma migrate status
      - name: Verify schema drift
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Typecheck
        run: npm run typecheck
      - name: Complete test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Ensure no unexpected tracked file modifications
        run: git diff --exit-code -- . ':(exclude)package.json' ':(exclude)package-lock.json'
      - name: Commit only tested dependency manifests to this branch
        run: |
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(deps): resolve audited production advisories within supported semver"
            git push origin HEAD:refs/heads/fix/security-production-audit-20261023
          else
            echo "No dependency files changed"
          fi
