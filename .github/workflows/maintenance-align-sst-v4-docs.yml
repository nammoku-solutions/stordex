name: maintenance-align-sst-v4-docs

on:
  push:
    branches:
      - maintenance/pin-sst-v4

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/pin-sst-v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align SST v4 documentation
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old!r}')
              if found == 0:
                  raise SystemExit(f'{path}: text not found: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'sst.config.ts',
              ' * SST v3 (Ion) — AWS deployment config for Stordex',
              ' * SST 4.17.1 — AWS deployment config for Stordex',
              1,
          )
          replace_exact(
              'README.md',
              '- **SST v3 / OpenNext** for AWS production',
              '- **SST 4.17.1 / OpenNext** for AWS production',
              1,
          )
          replace_exact(
              'ARCHITECTURE.md',
              'SST v3 / OpenNext',
              'SST 4.17.1 / OpenNext',
              2,
          )
          replace_exact(
              'AWS_DEPLOY.md',
              'Stordex production は SST v3 / OpenNext を使用して AWS へデプロイします。構成の正本は [`sst.config.ts`](sst.config.ts) です。',
              'Stordex production は SST 4.17.1 / OpenNext を使用して AWS へデプロイします。構成の正本は [`sst.config.ts`](sst.config.ts) です。SST CLI は repository の `devDependencies` に exact version で固定し、`npm ci` 後の `npx sst` はそのローカル版を使用します。',
              1,
          )
          replace_exact(
              'AWS_DEPLOY.md',
              '- SST access to the target AWS account',
              '- repository で固定された SST 4.17.1 CLI (`npm ci` で導入)\n- SST access to the target AWS account',
              1,
          )
          replace_exact(
              'AWS_DEPLOY.md',
              '4. `npm ci`\n5. `npm audit --omit=dev --audit-level=low`',
              '4. `npm ci`（lockfile から SST 4.17.1 を含む依存を再現）\n5. `npm audit --omit=dev --audit-level=low`',
              1,
          )
          PY

      - name: Commit aligned docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sst.config.ts README.md ARCHITECTURE.md AWS_DEPLOY.md
          git commit -m "docs: align Stordex with pinned SST v4.17.1"
          git push
