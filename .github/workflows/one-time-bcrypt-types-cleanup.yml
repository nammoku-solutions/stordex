name: One-time bcrypt types cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-bcrypt-types-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - name: Remove deprecated bcrypt type stub
        run: npm uninstall --save-dev @types/bcryptjs
      - name: Sanity-check generated dependency state
        run: |
          npm ci
          npm audit --omit=dev --audit-level=low
      - name: Create cleanup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-bcrypt-types-cleanup.yml
          git switch -c chore/remove-bcrypt-types
          git add package.json package-lock.json
          git commit -m 'chore: remove redundant bcrypt type stub'
          git push origin HEAD:chore/remove-bcrypt-types
