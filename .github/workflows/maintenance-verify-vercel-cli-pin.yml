name: maintenance-verify-vercel-cli-pin

on:
  push:
    branches:
      - build/pin-vercel-cli

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - name: Install and verify pinned Vercel CLI
        run: |
          npm install --global vercel@59.3.0
          test "$(vercel --version | tail -n 1)" = "Vercel CLI 59.3.0" || vercel --version
      - name: Verify repository dependencies remain clean
        run: |
          npm ci
          npm audit --audit-level=low
