name: maintenance-align-migration-docs

on:
  push:
    branches:
      - maintenance/stordex-initial-migration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/stordex-initial-migration

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Align migration documentation
        run: python scripts/align_migration_docs.py

      - name: Commit aligned docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ARCHITECTURE.md ENVIRONMENTS.md AWS_DEPLOY.md
          git commit -m "docs: align database migration guidance"
          git push
