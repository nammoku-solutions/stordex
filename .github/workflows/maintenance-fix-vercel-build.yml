name: maintenance-fix-vercel-build

on:
  push:
    branches:
      - fix/vercel-prisma-build

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stordex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stordex_test?schema=public
      NEXTAUTH_SECRET: ci-test-secret-only
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/vercel-prisma-build

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Align runtime and build command with CI/Vercel requirements
        run: |
          npm pkg set engines.node='22.x'
          npm pkg set scripts.build='prisma generate && next build'
          npm install --package-lock-only
          npm ci

      - name: Require clean dependency audit
        run: npm audit --audit-level=low

      - name: Apply committed migrations
        run: npx prisma migrate deploy

      - name: Verify build command generates Prisma Client itself
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Commit validated Vercel build fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: generate Prisma client during Vercel build"
          git push
