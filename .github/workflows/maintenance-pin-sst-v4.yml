name: maintenance-pin-sst-v4

on:
  push:
    branches:
      - maintenance/pin-sst-v4

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/pin-sst-v4

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Pin SST v4.17.1
        run: |
          npm install --save-dev --save-exact sst@4.17.1
          npm ci

      - name: Verify pinned SST and current config
        run: |
          npx sst version
          npx sst install

      - name: Require clean dependency audit
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Ensure validation did not mutate tracked source/config
        run: git diff --exit-code -- . ':(exclude)package.json' ':(exclude)package-lock.json'

      - name: Commit validated SST pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: pin SST CLI v4.17.1"
          git push
