name: maintenance-generate-initial-migration

on:
  push:
    branches:
      - maintenance/stordex-initial-migration

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: maintenance/stordex-initial-migration

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate initial migration from current schema
        run: |
          set -euo pipefail
          mkdir -p prisma/migrations/20260828093000_initial
          npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prisma/migrations/20260828093000_initial/migration.sql
          cat > prisma/migrations/migration_lock.toml <<'EOF'
          provider = "postgresql"
          EOF
          test -s prisma/migrations/20260828093000_initial/migration.sql

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "database: add initial Prisma migration"
          git push
