name: Apply Zod 4 update

on:
  push:
    branches:
      - deps/zod-4-migration

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[zod4]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deps/zod-4-migration
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
      - name: Update Zod and lockfile
        run: npm install zod@4.4.3
      - name: Audit
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit
      - name: Typecheck
        env:
          DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
        run: |
          npx prisma generate
          npm run typecheck
      - name: Unit tests
        env:
          DATABASE_URL: postgresql://stordex:stordex@localhost:5432/stordex?schema=public
        run: npm test
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'deps: migrate to Zod 4.4.3 [zod4]'
          git push origin HEAD:deps/zod-4-migration
