name: Fix Prisma 7 CLI adapter

on:
  push:
    branches:
      - deps/prisma-7-migration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[cli-adapter-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deps/prisma-7-migration
      - name: Update remaining CLI Prisma constructor
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/suspend-tenant.ts')
          text = p.read_text()
          old_import = 'import { PrismaClient } from "../src/generated/prisma/client";'
          new_import = 'import { PrismaPg } from "@prisma/adapter-pg";\nimport { PrismaClient } from "../src/generated/prisma/client";'
          if old_import not in text:
              raise SystemExit('Expected Prisma import not found')
          text = text.replace(old_import, new_import, 1)
          old_ctor = '  const prisma = new PrismaClient();'
          new_ctor = '''  const connectionString = process.env.DATABASE_URL;
          if (!connectionString) throw new Error("DATABASE_URL is required");
          const prisma = new PrismaClient({
            adapter: new PrismaPg({ connectionString }),
          });'''
          if old_ctor not in text:
              raise SystemExit('Expected Prisma constructor not found')
          p.write_text(text.replace(old_ctor, new_ctor, 1))
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/suspend-tenant.ts
          git commit -m 'fix: configure Prisma 7 adapter in tenant CLI [cli-adapter-fix]'
          git push origin HEAD:deps/prisma-7-migration
