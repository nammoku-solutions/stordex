name: Deploy Production (AWS / SST)

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

# 現行の AWS 認証（将来は GitHub OIDC + IAM Role への移行を推奨）:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Region は sst.config.ts と同じ ap-northeast-1 に固定する。
# SST シークレット (NextAuthSecret / NextAuthUrl) は事前に CLI で設定済みであること:
#   npx sst secret set NextAuthSecret "$(openssl rand -base64 32)" --stage prod
#   npx sst secret set NextAuthUrl    "https://app.example.com"   --stage prod

jobs:
  deploy:
    name: SST deploy --stage prod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 本番デプロイは GitHub Environment "production" の保護ルールで承認する。
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Prisma generate
        run: npx prisma generate

      - name: SST deploy
        run: npx sst deploy --stage prod

      - name: Summary
        run: echo "Production deployed to AWS (stage=prod)" >> "$GITHUB_STEP_SUMMARY"
