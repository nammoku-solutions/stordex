name: Deploy Production (AWS / SST)

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# AWS authentication uses GitHub Actions OIDC with a dedicated IAM role.
# Required GitHub Environment "production" secret:
#   AWS_DEPLOY_ROLE_ARN
# Region is fixed to the value used by sst.config.ts: ap-northeast-1.
# Do not store long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for this workflow.
# SST secrets (NextAuthSecret / NextAuthUrl) must be configured for stage=prod before deployment.

jobs:
  deploy:
    name: SST deploy --stage prod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-stordex-prod
          aws-region: ap-northeast-1

      - name: Verify AWS deployment identity
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Prisma generate
        run: npx prisma generate

      - name: SST deploy
        run: npx sst deploy --stage prod

      - name: Summary
        run: echo "Production deployed to AWS (stage=prod)" >> "$GITHUB_STEP_SUMMARY"
