name: Deploy Production (AWS / SST)

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Type DEPLOY to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    concurrency:
      group: stordex-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-1
      APP_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
      DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-stordex-production
          aws-region: ${{ env.AWS_REGION }}
      - run: aws sts get-caller-identity
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Configure SST secrets
        env:
          POOLED_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          NEXTAUTH_SECRET_VALUE: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL_VALUE: https://${{ vars.PRODUCTION_DOMAIN }}
        run: |
          npx sst secret set DatabaseUrl "$POOLED_DATABASE_URL" --stage prod
          npx sst secret set NextAuthSecret "$NEXTAUTH_SECRET_VALUE" --stage prod
          npx sst secret set NextAuthUrl "$NEXTAUTH_URL_VALUE" --stage prod
      - run: npx sst deploy --stage prod
      - run: curl --fail --retry 6 --retry-delay 10 "https://${{ vars.PRODUCTION_DOMAIN }}/login"
