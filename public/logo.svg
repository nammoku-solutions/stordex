<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Stordex">
  <title>Stordex</title>
  <!-- Background rounded square -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#bg)"/>

  <!-- Stylized stacked storage boxes (Stordex = Storage + Index) -->
  <!-- Bottom row: 2 boxes (64w + 8 gap + 64w = 136), centered -> x = (256-136)/2 = 60 -->
  <g transform="translate(60 152)">
    <rect x="0"   y="0" width="64" height="48" rx="6" fill="url(#box)" stroke="#92400e" stroke-width="2"/>
    <line x1="0" y1="14" x2="64" y2="14" stroke="#92400e" stroke-width="2"/>
    <rect x="72"  y="0" width="64" height="48" rx="6" fill="url(#box)" stroke="#92400e" stroke-width="2"/>
    <line x1="72" y1="14" x2="136" y2="14" stroke="#92400e" stroke-width="2"/>
  </g>
  <!-- Top box: 64 wide, centered -> x = (256-64)/2 = 96 -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="64" height="48" rx="6" fill="url(#box)" stroke="#92400e" stroke-width="2"/>
    <line x1="0" y1="14" x2="64" y2="14" stroke="#92400e" stroke-width="2"/>
  </g>

  <!-- Index check mark on top box (relative to box at 96..160, mid 128) -->
  <path d="M116 124 l8 8 l16 -16" fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark "S" overlay subtle (omitted for clarity at small sizes) -->
</svg>
