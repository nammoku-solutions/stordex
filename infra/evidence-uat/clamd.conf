# Dedicated Stordex Staging worker profile. No TCP, no debug or payload logs.
Foreground yes
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 3
LocalSocket /run/stordex-clamd/clamd.sock
LocalSocketGroup stordex-evidence
LocalSocketMode 0660
FixStaleSocket yes
ScanPDF yes
HeuristicAlerts yes
AlertEncryptedDoc yes
AlertExceedsMax yes
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 40M
MaxScanTime 15000
MaxThreads 2
